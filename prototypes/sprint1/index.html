<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Buddy - Course Management</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">

    <div class="logo">
        📚 <span>Lecture Buddy</span>
    </div>

    <div class="user">
        <span>👤 Student</span>
    </div>

</header>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h3>Navigation</h3>

        <ul>

            <li class="active">📘 Courses</li>

            <li>📝 Notes</li>

            <li>🤖 AI Learning</li>

            <li>📊 Review</li>

            <li>⚙ Settings</li>

        </ul>

    </aside>

    <!-- Main -->

    <main>

        <section class="hero">

            <div>

                <h1>My Courses</h1>

                <p>
                    Organize your learning materials by subject.
                </p>

            </div>

            <button id="addCourseBtn">
                + Add Course
            </button>

        </section>

        <!-- Empty State -->

        <section
            id="emptyState"
            class="empty-state">

            <h2>📚 No courses yet</h2>

            <p>

                Start by adding your first course.

            </p>

        </section>

        <!-- Course List -->

        <section
            id="courseList"
            class="course-grid">

        </section>

    </main>

</div>

<!-- Modal -->

<div
id="courseModal"
class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">

                Add Course

            </h2>

            <button
            id="closeModal">

                ✕

            </button>

        </div>

        <div class="form-group">

            <label>

                Course Name

            </label>

            <input
            type="text"
            id="courseName"
            placeholder="Software Engineering">

        </div>

        <div class="form-group">

            <label>

                Course Code

            </label>

            <input
            type="text"
            id="courseCode"
            placeholder="225311">

        </div>

        <div class="modal-footer">

            <button
            class="cancel-btn"
            id="cancelBtn">

                Cancel

            </button>

            <button
            class="save-btn"
            id="saveBtn">

                Save Course

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
