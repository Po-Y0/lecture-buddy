<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="Phumiphat_Registration_style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Create Your Study Notes Account</h1>
            <p>Sign up to securely save and manage your study notes.</p>

            <form id="registerForm">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name">

                <label for="studentid">Student ID</label>
                <input type="text" id="studentid" placeholder="Enter your student ID">

                <label for="email">University Email</label>
                <input type="email" id="email" placeholder="example@student.ac.th">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">

                <button type="submit">Create Account</button>

                <p class="login-text">
                    Already have an account?
                    <a href="#">Login</a>
                </p>
            </form>

            <p id="message"></p>

        </div>
    </div>

        <script>
        const form = document.getElementById("registerForm");
    </script>

</body>

</body>
</html>
