services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lecture_buddy
      POSTGRES_USER: lecture_buddy
      POSTGRES_PASSWORD: lecture_buddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture_buddy -d lecture_buddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://lecture_buddy:lecture_buddy@db:5432/lecture_buddy
      WEB_ORIGIN: http://localhost:5173
      SESSION_COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 20971520
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    volumes:
      - lecture_buddy_uploads:/app/data
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python -m alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000",
      ]

volumes:
  postgres_data:
  lecture_buddy_uploads:
